<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
(function(){
  try{
    var t=localStorage.getItem("lava.theme");
    if(t){ try{ t=JSON.parse(t); }catch(e){} document.documentElement.dataset.theme=(t==="dark")?"dark":"light"; }
  }catch(e){}
  try{
    var l=localStorage.getItem("lava.lang");
    if(l){ try{ l=JSON.parse(l); }catch(e){}
      if(l){ document.documentElement.lang=l;
        if(l==="ar") document.documentElement.dir="rtl"; } }
  }catch(e){}
})();
</script>
